[package]
name = "fvcommand"
version = "0.1.0"
edition = "2024"

[dependencies]
cpal = "0.18.2"
rustpotter = "3.0.2"
tokio = { version = "1.54.1", features = ["rt-multi-thread",
    "macros",
    "sync",
    "time",
    "signal"] }
toml = "1.2.1"
transcribe-rs = { version = "0.3.12", features = ["onnx"] }
